[package]
name = "urchin-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
embedded-graphics = "0.8.2"
embedded-hal = "1"
embedded-hal-async = "1"
heapless = "0.9"
futures = "0.3"
# Match firmware exactly: RMK PR #1347, with ordered tap-hold enabled by default.
rmk = { git = "https://github.com/felipebalbi/rmk.git", rev = "ca1dda5bd3fedd2804cd558f5e86e03a46c41c05", default-features = false, features = ["std", "log", "split"] }
rmk-config = { git = "https://github.com/felipebalbi/rmk.git", rev = "ca1dda5bd3fedd2804cd558f5e86e03a46c41c05" }
# rmk-config enables serde/std in native tests. Match that feature on the
# legacy serializer used by embassy-usb so its Error implements StdError.
ssmarshal = { version = "1.0", features = ["std"] }
embassy-time = "0.5"
embassy-futures = "0.1"
critical-section = { version = "1", features = ["std"] }
log = "0.4"
serde_json = "1"
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1", "embedded-hal-async"] }

# Match firmware and RMK; dependency patches only apply at the root.
[patch.crates-io]
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "12b84e3dd8d6b31f045649b84250292c34e024d4" }
